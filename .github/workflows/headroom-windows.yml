name: Windows Headroom verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headroom-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CODEX_HEADROOM: '0'
      CODEX_HEADROOM_REQUIRED: '0'
      CODEX_FORGE_HEADROOM_ACTIVE: '0'
      HEADROOM_OFFLINE: '1'
      HEADROOM_BEACON: 'off'
      HEADROOM_UPDATE_CHECK: 'off'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify runtimes
        shell: pwsh
        run: |
          node --version
          python --version

      - name: Install isolated Headroom proxy
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'headroom-venv'
          python -m venv --copies $venv
          $venvPython = Join-Path $venv 'Scripts\python.exe'
          & $venvPython -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: 'headroom-ai[proxy]==0.45.0'
          & $venvPython -m pip check
          "CODEX_HEADROOM_BIN=$(Join-Path $venv 'Scripts\headroom.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run offline Headroom unit tests
        run: node --test tests/headroom.test.mjs

      - name: Run offline Headroom proxy smoke test
        run: npm run headroom:smoke
