name: Upstream metadata report

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Compare recorded source revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upstream-report.mjs
      - name: Check catalog schema and security boundaries
        run: npm run check && npm run security && npm run licenses
